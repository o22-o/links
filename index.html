<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsherMontana1 - Official Links</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-ambient"></div>
    <!-- אלמנט תאורה כחולה שעוקבת אחרי העכבר -->
    <div class="mouse-glow" id="mouseGlow"></div>
    
    <div class="container">
        <!-- פרופיל -->
        <div class="profile">
            <div class="avatar-wrapper">
                <div class="avatar-ring">
                    <img src="https://files.kick.com/images/user/103858679/profile_image/conversion/e9e57e44-931c-49a6-80cf-4690f3d53f64-fullsize.webp" alt="OsherMontana1" class="profile-img">
                </div>
            </div>
            <h1>OsherMontana1</h1>
            <div class="badge">• OFFICIAL LINKS •</div>
        </div>

        <div class="divider">
            <span>הקישורים שלי</span>
        </div>

        <!-- גריד כפתורים -->
        <div class="links-grid">
            
            <!-- Kick -->
            <a href="https://kick.com/oshermontana1" target="_blank" class="link-card kick">
                <div class="card-content">
                    <h2>Kick</h2>
                    <p>שידורים חיים</p>
                </div>
                <div class="card-icon kick-logo-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M3 3h5v5H3V3m6 0h5v5H9V3m6 0h5v5h-5V3M3 9h5v5H3V9m12 0h5v5h-5V9M3 15h5v5H3v-5m6 0h5v5H9v-5m6 0h5v5h-5v-5z"/>
                    </svg>
                </div>
            </a>

            <!-- Discord -->
            <a href="https://discord.gg/6kEYKWxuET" target="_blank" class="link-card discord">
                <div class="card-icon">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="card-content">
                    <h2>Discord</h2>
                    <p>לעדכונים על לייבים</p>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com" target="_blank" class="link-card youtube">
                <div class="card-content">
                    <h2>YouTube</h2>
                    <p>לערוץ היוטיוב שלי</p>
                </div>
                <div class="card-icon">
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@oshermontana1" target="_blank" class="link-card tiktok">
                <div class="card-icon">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="card-content">
                    <h2>TikTok</h2>
                    <p>לערוץ הטיקטוק שלי</p>
                </div>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/oshermontana1/" target="_blank" class="link-card instagram">
                <div class="card-content">
                    <h2>Instagram</h2>
                    <p>לאינסטגרם שלי</p>
                </div>
                <div class="card-icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>
            </a>

        </div>
    </div>

    <!-- סקריפט למעקב העכבר -->
    <script>
        const glow = document.getElementById('mouseGlow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
